[package]
name = "confgen"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
bon = "3.9.3"
capctl = "0.2.4"
clap = { version = "4.6.1", features = ["derive"] }
nix = { version = "0.31.3", features = ["user"] }
rootasrole-core = { version = "4.2.0", path = "../RootAsRole/core" }
serde = { version = "1.0.228", features = ["rc", "derive"] }
serde_json = "1.0.150"

# perf/ is inside the RootAsRole repository, but confgen is not one of its crates
[workspace]
